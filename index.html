<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="기억">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>기억</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #000;
    --ink: #f4f4f2;
    --soft: #8c8c8c;
    --faint: #3a3a3a;
    --sheet: #1a1a1a;
    --spring: cubic-bezier(.34, 1.4, .5, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  input:focus-visible, textarea:focus-visible { outline: none; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 140px; }

  /* 카테고리 */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -22px 34px; padding: 4px 22px;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: none; font-size: 19px; font-weight: 600; padding: 10px 20px; border-radius: 999px;
    color: var(--soft); background: transparent;
    transition: background .35s var(--ease), color .35s var(--ease), transform .25s var(--spring);
  }
  .cat:active { transform: scale(.93); }
  .cat.on { background: var(--ink); color: #000; font-weight: 700; }
  .cat.plus { font-size: 22px; padding: 8px 16px; color: var(--faint); }
  .cat.plus:hover { color: var(--soft); }
  .newcat {
    flex: none; width: 140px; font-size: 19px; padding: 10px 20px; border-radius: 999px;
    background: #2a2a2a; color: var(--ink); animation: grow .4s var(--spring);
  }
  @keyframes grow { from { width: 40px; opacity: 0; } }

  /* 목록 */
  .list { transition: opacity .2s ease, transform .3s var(--ease); }
  .list.swap { opacity: 0; transform: translateY(8px); }
  .item {
    padding: 22px 0 26px; cursor: default;
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows .4s var(--ease), opacity .3s ease, padding .4s var(--ease);
  }
  .item > div { overflow: hidden; }
  .item.gone { grid-template-rows: 0fr; opacity: 0; padding: 0; }
  .item.fresh { animation: pop .7s var(--spring); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(6px); }
  }
  .text {
    font-size: 29px; font-weight: 700; line-height: 1.45; letter-spacing: -0.03em; white-space: pre-wrap;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .who { font-size: 17px; font-weight: 500; color: var(--soft); margin-top: 8px; }
  .del {
    font-size: 15px; color: var(--soft); margin-top: 10px; padding: 6px 12px;
    border-radius: 999px; background: var(--sheet);
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity .25s ease, transform .3s var(--ease), background .2s, color .2s;
  }
  .item.open .del { opacity: 1; transform: none; pointer-events: auto; }
  .del.sure { background: #3a1414; color: #ffb4b4; }

  .empty { padding: 70px 0; text-align: center; color: var(--faint); font-size: 22px; line-height: 1.7; }
  .empty button { font-size: 15px; color: var(--soft); margin-top: 18px; text-decoration: underline; text-underline-offset: 4px; }

  /* 플러스 버튼 */
  .fab {
    position: fixed; right: max(22px, calc(50vw - 338px)); bottom: calc(26px + env(safe-area-inset-bottom));
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--ink); color: #000; z-index: 20;
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(255,255,255,.12);
    transition: transform .45s var(--spring), opacity .25s ease;
  }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 28px; height: 28px; transition: transform .45s var(--spring); }
  body.writing .fab svg { transform: rotate(135deg); }
  body.setting .fab { transform: scale(0); opacity: 0; pointer-events: none; }

  /* 입력 시트 */
  .dim {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    max-width: 720px; margin: 0 auto;
    background: var(--sheet); border-radius: 28px 28px 0 0;
    padding: 26px 22px calc(110px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .5s var(--ease);
  }
  body.writing .dim { opacity: 1; pointer-events: auto; }
  body.writing .sheet { transform: none; transition-timing-function: var(--spring); }
  .sheet textarea {
    display: block; width: 100%; font-size: 26px; font-weight: 600; line-height: 1.5; min-height: 120px; resize: none;
  }
  .sheet input {
    width: 100%; font-size: 18px; padding: 14px 0 4px; margin-top: 10px;
    border-top: 1px solid #2c2c2c; color: var(--ink);
  }
  ::placeholder { color: #555; }
  .save {
    position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom));
    height: 66px; padding: 0 30px; border-radius: 999px; font-size: 20px; font-weight: 700;
    background: #2c2c2c; color: var(--soft);
    transition: background .25s, color .25s, transform .3s var(--spring);
  }
  .save.ready { background: var(--ink); color: #000; }
  .save:active { transform: scale(.94); }
  .save.busy { animation: breathe 1.1s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .45; } }

  /* 상단: 카테고리 + 설정 */
  .top { display: flex; align-items: center; gap: 6px; margin-bottom: 34px; }
  .top .cats { flex: 1; min-width: 0; margin: 0 0 0 -22px; }
  .gear {
    flex: none; width: 44px; height: 44px; border-radius: 50%; color: var(--faint);
    display: grid; place-items: center; transition: color .2s, transform .5s var(--spring);
  }
  .gear:hover { color: var(--soft); }
  .gear:active { transform: rotate(60deg) scale(.9); }
  .gear svg { width: 24px; height: 24px; }

  /* 설정 시트 */
  .setsheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    max-width: 720px; margin: 0 auto;
    background: var(--sheet); border-radius: 28px 28px 0 0;
    padding: 30px 22px calc(30px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .5s var(--ease);
  }
  body.setting .dim { opacity: 1; pointer-events: auto; }
  body.setting .setsheet { transform: none; transition-timing-function: var(--spring); }
  .setsheet h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .setsheet p { font-size: 15px; color: var(--soft); line-height: 1.6; margin-bottom: 20px; }
  .setsheet p a { color: var(--ink); }
  .setsheet input {
    width: 100%; font-size: 17px; padding: 16px 18px; border-radius: 16px; background: #262626; color: var(--ink);
  }
  .setrow { display: flex; gap: 10px; margin-top: 14px; }
  .setrow button {
    flex: 1; height: 58px; border-radius: 999px; font-size: 18px; font-weight: 700;
    transition: transform .3s var(--spring);
  }
  .setrow button:active { transform: scale(.95); }
  .setrow .ok { background: var(--ink); color: #000; }
  .setrow .no { background: #262626; color: var(--soft); }

  /* 알림 */
  .toast {
    position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); z-index: 30;
    max-width: calc(100% - 32px); padding: 13px 20px; border-radius: 999px;
    background: #262626; color: var(--ink); font-size: 15px; font-weight: 600; text-align: center;
    transform: translate(-50%, -140%); opacity: 0;
    transition: transform .5s var(--spring), opacity .3s ease;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <nav class="cats" id="cats"></nav>
      <button class="gear" id="gear" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <section class="list" id="list"></section>
  </main>

  <form class="setsheet" id="setsheet" aria-hidden="true">
    <h2>맞춤법 자동 교정</h2>
    <p>제미나이 키를 넣어두면 추가할 때마다 띄어쓰기랑 맞춤법을 고쳐서 저장해. 키는 이 기기에만 저장돼.
      키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 받을 수 있어.</p>
    <input id="apikey" type="password" placeholder="제미나이 API 키" autocomplete="off" spellcheck="false">
    <div class="setrow">
      <button class="no" type="button" id="setclose">닫기</button>
      <button class="ok" type="submit">저장</button>
    </div>
  </form>

  <div class="toast" id="toast" role="status"></div>

  <div class="dim" id="dim"></div>
  <form class="sheet" id="sheet" aria-hidden="true">
    <textarea id="text" placeholder="기억할 말을 적어줘"></textarea>
    <input id="who" placeholder="누가 한 말이야? (안 적어도 돼)" autocomplete="off">
    <button class="save" id="save" type="submit">추가</button>
  </form>

  <button class="fab" id="fab" aria-label="새 글 추가">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

<script>
const KEY = "giuk-v1";
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!db || !db.cats) db = { cats: ["기본"], items: [], cur: "기본" };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
let freshId = null;

function renderCats() {
  if (!db.cats.includes(db.cur)) db.cur = db.cats[0];
  $("cats").innerHTML =
    db.cats.map(c => `<button class="cat ${c === db.cur ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") +
    `<button class="cat plus" id="addcat" aria-label="카테고리 추가">+</button>`;
}

function renderList() {
  const items = db.items.filter(i => i.cat === db.cur);
  $("list").innerHTML = items.length
    ? items.map(i => `<article class="item ${i.id === freshId ? "fresh" : ""}" data-id="${i.id}"><div>
        <p class="text">${esc(i.text)}</p>
        ${i.who ? `<p class="who">${esc(i.who)}</p>` : ""}
        <button class="del" type="button">지우기</button>
      </div></article>`).join("")
    : `<div class="empty">여기는 아직 비어 있어<br>아래 + 를 눌러 적어봐
        ${db.cats.length > 1 ? `<br><button id="rmcat">이 카테고리 지우기</button>` : ""}</div>`;
  freshId = null;
}

function render() { renderCats(); renderList(); }

function switchTo(c) {
  if (c === db.cur) return;
  db.cur = c; save(); renderCats();
  const l = $("list"); l.classList.add("swap");
  setTimeout(() => { renderList(); l.classList.remove("swap"); }, 180);
}

$("cats").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "addcat") {
    const inp = document.createElement("input");
    inp.className = "newcat"; inp.placeholder = "이름";
    b.replaceWith(inp); inp.focus();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      const n = inp.value.trim();
      if (ok && n && !db.cats.includes(n)) { db.cats.push(n); save(); renderCats(); switchTo(n); }
      else renderCats();
    };
    inp.onkeydown = ev => { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); };
    inp.onblur = () => finish(true);
  } else switchTo(b.dataset.c);
};

/* 시트 */
const open = () => {
  document.body.classList.add("writing"); $("sheet").setAttribute("aria-hidden", "false");
  setTimeout(() => $("text").focus(), 120);
};
const close = () => {
  document.body.classList.remove("writing"); $("sheet").setAttribute("aria-hidden", "true");
  document.activeElement.blur();
};
$("fab").onclick = () => document.body.classList.contains("writing") ? close() : open();
$("dim").onclick = () => { if (!busy) close(); closeSet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!busy) close(); closeSet(); } });
$("text").oninput = () => $("save").classList.toggle("ready", !!$("text").value.trim());
$("text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("sheet").requestSubmit(); };

/* 알림 */
let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* 설정 */
const KEYNAME = "giuk-gemini-key";
const getKey = () => { try { return localStorage.getItem(KEYNAME) || ""; } catch (e) { return ""; } };
function openSet() {
  close(); $("apikey").value = getKey();
  document.body.classList.add("setting"); $("setsheet").setAttribute("aria-hidden", "false");
}
function closeSet() {
  document.body.classList.remove("setting"); $("setsheet").setAttribute("aria-hidden", "true");
}
$("gear").onclick = openSet;
$("setclose").onclick = closeSet;
$("setsheet").onsubmit = e => {
  e.preventDefault();
  const k = $("apikey").value.trim();
  try { k ? localStorage.setItem(KEYNAME, k) : localStorage.removeItem(KEYNAME); } catch (err) {}
  closeSet(); toast(k ? "키 저장했어. 이제 추가하면 자동으로 고쳐줘" : "키를 지웠어");
};

/* 제미나이로 띄어쓰기·맞춤법 교정
   2.5 플래시를 먼저 쓰고, 구글이 그 모델을 안 주면(404) 공식 후속 모델로 넘어감 */
const MODELS = [
  { id: "gemini-2.5-flash", gen: { temperature: 0, thinkingConfig: { thinkingBudget: 0 } } },
  { id: "gemini-3.5-flash-lite", gen: { temperature: 0 } }
];
const PROMPT =
  "너는 한국어 맞춤법 교정기야. 사용자가 보낸 글의 띄어쓰기와 맞춤법만 고쳐. " +
  "내용, 말투, 단어 선택, 줄바꿈은 그대로 둬. 틀린 게 없으면 원문을 그대로 돌려줘. " +
  "설명이나 따옴표 없이 고친 글만 출력해.";

async function callModel(model, text, key, signal) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.id}:generateContent`, {
    method: "POST", signal,
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: PROMPT }] },
      contents: [{ role: "user", parts: [{ text }] }],
      generationConfig: model.gen
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || "";
    const e = new Error(
      /API key/i.test(msg) || res.status === 403 ? "키가 맞지 않아"
      : res.status === 429 ? "사용량 한도 초과"
      : `오류 ${res.status}${msg ? ": " + msg.slice(0, 60) : ""}`);
    e.status = res.status; throw e;
  }
  const out = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("").trim();
  if (!out) throw new Error("빈 응답");
  return out;
}

async function fixSpelling(text, key) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    let last;
    for (const m of MODELS) {
      try { return await callModel(m, text, key, ctrl.signal); }
      catch (err) { last = err; if (err.status !== 404) throw err; }
    }
    throw last;
  } catch (err) {
    throw new Error(err.name === "AbortError" ? "응답이 너무 느려" : err.message);
  } finally { clearTimeout(timer); }
}

let busy = false;
$("sheet").onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  let text = $("text").value.trim(); if (!text) { $("text").focus(); return; }
  const who = $("who").value.trim();
  const key = getKey();
  let note = "";
  if (!key) note = "설정(톱니바퀴)에서 키를 넣으면 맞춤법도 고쳐줘";
  else {
    busy = true; const b = $("save"); b.classList.add("busy"); b.textContent = "고치는 중";
    try {
      const fixed = await fixSpelling(text, key);
      if (fixed !== text) note = "맞춤법 고쳐서 저장했어";
      text = fixed;
    } catch (err) { note = `못 고치고 그대로 저장했어 (${err.message})`; }
    b.classList.remove("busy"); b.textContent = "추가"; busy = false;
  }
  const item = { id: Date.now(), cat: db.cur, text, who };
  db.items.unshift(item); freshId = item.id; save();
  $("text").value = ""; $("who").value = ""; $("save").classList.remove("ready");
  close();
  setTimeout(() => { renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); if (note) toast(note); }, 220);
};

/* 글 누르면 지우기 버튼, 두 번 누르면 삭제 */
$("list").onclick = e => {
  if (e.target.id === "rmcat") {
    db.cats = db.cats.filter(c => c !== db.cur);
    db.items = db.items.filter(i => i.cat !== db.cur);
    db.cur = db.cats[0]; save(); render(); return;
  }
  const item = e.target.closest(".item"); if (!item) return;
  const del = e.target.closest(".del");
  if (del) {
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "정말 지울까?"; return; }
    item.classList.add("gone");
    db.items = db.items.filter(i => i.id != item.dataset.id); save();
    setTimeout(() => { if (!db.items.some(i => i.cat === db.cur)) renderList(); else item.remove(); }, 420);
    return;
  }
  document.querySelectorAll(".item.open").forEach(x => {
    if (x !== item) { x.classList.remove("open"); const d = x.querySelector(".del"); d.classList.remove("sure"); d.textContent = "지우기"; }
  });
  item.classList.toggle("open");
  if (!item.classList.contains("open")) { const d = item.querySelector(".del"); d.classList.remove("sure"); d.textContent = "지우기"; }
};

render();
</script>
</body>
</html>
