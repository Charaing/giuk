<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="기억">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>기억</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #000;
    --ink: #f4f4f2;
    --soft: #8c8c8c;
    --faint: #3a3a3a;
    --sheet: #1a1a1a;
    --spring: cubic-bezier(.34, 1.4, .5, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  input:focus-visible, textarea:focus-visible { outline: none; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 140px; }

  /* 카테고리 */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -22px 34px; padding: 4px 22px;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: none; font-size: 19px; font-weight: 600; padding: 10px 20px; border-radius: 999px;
    color: var(--soft); background: transparent;
    transition: background .35s var(--ease), color .35s var(--ease), transform .25s var(--spring);
  }
  .cat:active { transform: scale(.93); }
  .cat.on { background: var(--ink); color: #000; font-weight: 700; }
  .cat.plus { font-size: 22px; padding: 8px 16px; color: var(--faint); }
  .cat.plus:hover { color: var(--soft); }
  .newcat {
    flex: none; width: 140px; font-size: 19px; padding: 10px 20px; border-radius: 999px;
    background: #2a2a2a; color: var(--ink); animation: grow .4s var(--spring);
  }
  @keyframes grow { from { width: 40px; opacity: 0; } }

  /* 목록 */
  .list { transition: opacity .2s ease, transform .3s var(--ease); }
  .list.swap { opacity: 0; transform: translateY(8px); }
  .item {
    padding: 12px 0 14px; cursor: default;
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows .4s var(--ease), opacity .3s ease, padding .4s var(--ease);
  }
  .item > div { overflow: hidden; }
  .item.gone { grid-template-rows: 0fr; opacity: 0; padding: 0; }
  .item.fresh { animation: pop .7s var(--spring); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(6px); }
  }
  .text {
    font-size: 29px; font-weight: 700; line-height: 1.35; letter-spacing: -0.03em; white-space: pre-wrap;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .who { font-size: 17px; font-weight: 500; color: var(--soft); margin-top: 4px; }
  .del {
    display: block; font-size: 15px; line-height: 1; color: var(--soft);
    height: 0; margin-top: 0; padding: 0 12px; overflow: hidden;
    border-radius: 999px; background: var(--sheet);
    opacity: 0; pointer-events: none;
    transition: height .3s var(--ease), margin .3s var(--ease), padding .3s var(--ease), opacity .25s ease, background .2s, color .2s;
  }
  .item.open .del { height: 30px; margin-top: 8px; padding: 7px 12px; opacity: 1; pointer-events: auto; }
  .del.sure { background: #3a1414; color: #ffb4b4; }

  .empty { padding: 70px 0; text-align: center; color: var(--faint); font-size: 22px; line-height: 1.7; }
  .empty button { font-size: 15px; color: var(--soft); margin-top: 18px; text-decoration: underline; text-underline-offset: 4px; }

  /* 플러스 버튼 */
  .fab {
    position: fixed; right: max(22px, calc(50vw - 338px)); bottom: calc(26px + env(safe-area-inset-bottom));
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--ink); color: #000; z-index: 20;
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(255,255,255,.12);
    transition: transform .45s var(--spring), opacity .25s ease;
  }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 28px; height: 28px; transition: transform .45s var(--spring); }
  body.writing .fab svg { transform: rotate(135deg); }

  /* 입력 시트 */
  .dim {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    max-width: 720px; margin: 0 auto;
    background: var(--sheet); border-radius: 28px 28px 0 0;
    padding: 26px 22px calc(110px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .5s var(--ease);
  }
  body.writing .dim { opacity: 1; pointer-events: auto; }
  body.writing .sheet { transform: none; transition-timing-function: var(--spring); }
  .sheet textarea {
    display: block; width: 100%; font-size: 26px; font-weight: 600; line-height: 1.5; min-height: 120px; resize: none;
  }
  .sheet input {
    width: 100%; font-size: 18px; padding: 14px 0 4px; margin-top: 10px;
    border-top: 1px solid #2c2c2c; color: var(--ink);
  }
  ::placeholder { color: #555; }
  .save {
    position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom));
    height: 66px; padding: 0 30px; border-radius: 999px; font-size: 20px; font-weight: 700;
    background: #2c2c2c; color: var(--soft);
    transition: background .25s, color .25s, transform .3s var(--spring);
  }
  .save.ready { background: var(--ink); color: #000; }
  .save:active { transform: scale(.94); }
  /* 상단: 카테고리 + 설정 */
  .top { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
  .top .cats { flex: 1; min-width: 0; margin: 0 0 0 -22px; }
  /* 알림 */
  .toast {
    position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); z-index: 30;
    max-width: calc(100% - 32px); padding: 13px 20px; border-radius: 999px;
    background: #262626; color: var(--ink); font-size: 15px; font-weight: 600; text-align: center;
    transform: translate(-50%, -140%); opacity: 0;
    transition: transform .5s var(--spring), opacity .3s ease;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <nav class="cats" id="cats"></nav>
    </div>
    <section class="list" id="list"></section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <div class="dim" id="dim"></div>
  <form class="sheet" id="sheet" aria-hidden="true">
    <textarea id="text" placeholder="기억할 말을 적어줘"></textarea>
    <input id="who" placeholder="누가 한 말이야? (안 적어도 돼)" autocomplete="off">
    <button class="save" id="save" type="submit">추가</button>
  </form>

  <button class="fab" id="fab" aria-label="새 글 추가">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

<script>
const KEY = "giuk-v1";
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!db || !db.cats) db = { cats: ["기본"], items: [], cur: "기본" };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
let freshId = null;

function renderCats() {
  if (!db.cats.includes(db.cur)) db.cur = db.cats[0];
  $("cats").innerHTML =
    db.cats.map(c => `<button class="cat ${c === db.cur ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") +
    `<button class="cat plus" id="addcat" aria-label="카테고리 추가">+</button>`;
}

function renderList() {
  const items = db.items.filter(i => i.cat === db.cur);
  $("list").innerHTML = items.length
    ? items.map(i => `<article class="item ${i.id === freshId ? "fresh" : ""}" data-id="${i.id}"><div>
        <p class="text">${esc(i.text)}</p>
        ${i.who ? `<p class="who">${esc(i.who)}</p>` : ""}
        <button class="del" type="button">지우기</button>
      </div></article>`).join("")
    : `<div class="empty">여기는 아직 비어 있어<br>아래 + 를 눌러 적어봐
        ${db.cats.length > 1 ? `<br><button id="rmcat">이 카테고리 지우기</button>` : ""}</div>`;
  freshId = null;
}

function render() { renderCats(); renderList(); }

function switchTo(c) {
  if (c === db.cur) return;
  db.cur = c; save(); renderCats();
  const l = $("list"); l.classList.add("swap");
  setTimeout(() => { renderList(); l.classList.remove("swap"); }, 180);
}

$("cats").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "addcat") {
    const inp = document.createElement("input");
    inp.className = "newcat"; inp.placeholder = "이름";
    b.replaceWith(inp); inp.focus();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      const n = inp.value.trim();
      if (ok && n && !db.cats.includes(n)) { db.cats.push(n); save(); renderCats(); switchTo(n); }
      else renderCats();
    };
    inp.onkeydown = ev => { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); };
    inp.onblur = () => finish(true);
  } else switchTo(b.dataset.c);
};

/* 시트 */
const open = () => {
  document.body.classList.add("writing"); $("sheet").setAttribute("aria-hidden", "false");
  setTimeout(() => $("text").focus(), 120);
};
const close = () => {
  document.body.classList.remove("writing"); $("sheet").setAttribute("aria-hidden", "true");
  document.activeElement.blur();
};
$("fab").onclick = () => document.body.classList.contains("writing") ? close() : open();
$("dim").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
$("text").oninput = () => $("save").classList.toggle("ready", !!$("text").value.trim());
$("text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("sheet").requestSubmit(); };

/* 알림 */
let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* @@FIX-START */
/* 규칙으로 맞춤법·띄어쓰기 교정 (인터넷·AI 없이 기기에서 바로) */
const fixText = (() => {
  const H = ch => { const c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c < 11172 ? c : -1; };
  const fin = ch => { const c = H(ch); return c < 0 ? -1 : c % 28; };      // 받침: 0 없음, 4 ㄴ, 8 ㄹ
  const vow = ch => { const c = H(ch); return c < 0 ? -1 : Math.floor(c / 28) % 21; };
  const dropFin = ch => String.fromCharCode(ch.charCodeAt(0) - fin(ch));

  // 자주 틀리는 말 (틀린 말 → 바른 말)
  const WORDS = [
    ["웬지", "왠지"], ["왠만", "웬만"], ["왠일", "웬일"], ["왠걸", "웬걸"],
    ["금새", "금세"], ["오랫만", "오랜만"], ["희안", "희한"], ["역활", "역할"],
    ["설겆이", "설거지"], ["어의없", "어이없"], ["어의가 없", "어이가 없"],
    ["일일히", "일일이"], ["깨끗히", "깨끗이"], ["곰곰히", "곰곰이"], ["틈틈히", "틈틈이"],
    ["번번히", "번번이"], ["솔찍", "솔직"], ["어짜피", "어차피"], ["설레임", "설렘"],
    ["바램", "바람"], ["뵈요", "봬요"], ["뵜", "뵀"], ["되요", "돼요"], ["되서", "돼서"],
    ["됬", "됐"], ["어떻해", "어떡해"], ["어떻하", "어떡하"], ["문안하", "무난하"],
    ["않돼", "안 돼"], ["않되", "안 되"], ["않해", "안 해"], ["않했", "안 했"], ["않하", "안 하"],
    ["할려고", "하려고"], ["할려면", "하려면"], ["할려는", "하려는"], ["갈려고", "가려고"],
    ["볼려고", "보려고"], ["먹을려고", "먹으려고"], ["잘려고", "자려고"], ["줄려고", "주려고"],
    ["내꺼", "내 거"], ["니꺼", "네 거"], ["제꺼", "제 거"], ["구지 ", "굳이 "],
    ["몇일", "며칠"], ["몇 일", "며칠"], ["희얀", "희한"], ["애띤", "앳된"], ["메세지", "메시지"],
    ["악세사리", "액세서리"], ["어떻게해", "어떻게 해"], ["건들이", "건드리"],
    ["대려", "데려"], ["궂이", "굳이"]
  ];
  const NOT_GEO = ["선거", "근거", "논거", "준거", "철거", "열거", "은거", "별거", "탈거", "전거"];
  const NOT_JEOK = ["인적", "산적", "전적"];
  const END = "(?=[야다지면든니고라임]|예요|에요|같|[\\s.,!?~]|$)";

  function fixLine(s) {
    s = s.replace(/[ \t ]+/g, " ").trim();
    for (const [a, b] of WORDS) s = s.split(a).join(b);

    // ㄹ 받침 + 께/꺼 → 게/거 (할께 → 할게, 할꺼야 → 할거야)
    s = s.replace(/([가-힣])께/g, (m, p) => fin(p) === 8 ? p + "게" : m);
    s = s.replace(new RegExp("([가-힣])꺼" + END, "g"), (m, p) => fin(p) === 8 ? p + "거" : m);

    // 의존 명사 띄우기: 할 것, 다른 거, 할 수 있다, 할 줄 알다, 할 때, 본 적이
    s = s.replace(new RegExp("([가-힣])(것|거)" + END, "g"), (m, p, w, i, all) => {
      if ((p + w === "별것") || NOT_GEO.includes(p + w)) return m;
      return fin(p) === 4 || fin(p) === 8 ? p + " " + w : m;
    });
    s = s.replace(/([가-힣])수(있|없|도|가|는|밖에|조차)/g, (m, p, r) => fin(p) === 8 ? p + " 수" + r : m);
    s = s.replace(/ 수(도|가|는|조차)(있|없)/g, " 수$1 $2");
    s = s.replace(/ 수(있|없)/g, " 수 $1");
    s = s.replace(/([가-힣])줄(알|몰)/g, (m, p, r) => fin(p) === 8 ? p + " 줄 " + r : m);
    s = s.replace(/([가-힣])때/g, (m, p) => fin(p) === 8 ? p + " 때" : m);
    s = s.replace(/([가-힣])적(?=이|있|없|도|은)/g, (m, p) => fin(p) === 4 && !NOT_JEOK.includes(p + "적") ? p + " 적" : m);
    s = s.replace(/ 적(이|도|은)(있|없)/g, " 적$1 $2");

    // 안 + 동사 띄우기 (안해 → 안 해, 안돼 → 안 돼)
    s = s.replace(/(^|\s)안(해|했|하|돼|됐|되|갔|가요|가(?=[\s.!?~]|$)|먹|봐|봤|와|왔|줘|줬|들어|들려|좋|싫|읽|써|썼|자요|잤|맞|올|갈|할|될|보여|보이|오|먹어)/g, "$1안 $2");

    // ~해야 해/돼
    s = s.replace(/([가-힣])야(돼|되|해|하|했|됐)/g, (m, p, r) =>
      fin(p) === 0 && [0, 1, 4, 5, 6, 9, 10, 14].includes(vow(p)) ? p + "야 " + r : m);

    // 몇 + 단위
    s = s.replace(/몇(번|개|명|시|살|년|달|주|분|초|권|장|잔|마리|가지|군데)/g, "몇 $1");

    // 문장 끝 '되' → '돼' (안 되. → 안 돼.)
    s = s.replace(/되(?=[.!?~]+|$)/g, "돼");

    // 문장 부호 앞 공백 빼고 뒤에 공백
    s = s.replace(/ +([.,!?])/g, "$1");
    s = s.replace(/([,!?]|[^.\d]\.|\.\.\.)(?=[가-힣A-Za-z])/g, "$1 ");

    return s.replace(/ {2,}/g, " ").trim();
  }

  return text => text.split("\n").map(fixLine).join("\n").trim();
})();
/* @@FIX-END */

$("sheet").onsubmit = e => {
  e.preventDefault();
  const raw = $("text").value.trim(); if (!raw) { $("text").focus(); return; }
  const text = fixText(raw);
  const note = text !== raw ? "맞춤법 고쳐서 저장했어" : "";
  const item = { id: Date.now(), cat: db.cur, text, who: $("who").value.trim() };
  db.items.unshift(item); freshId = item.id; save();
  $("text").value = ""; $("who").value = ""; $("save").classList.remove("ready");
  close();
  setTimeout(() => { renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); if (note) toast(note); }, 220);
};

/* 글 누르면 지우기 버튼, 두 번 누르면 삭제 */
$("list").onclick = e => {
  if (e.target.id === "rmcat") {
    db.cats = db.cats.filter(c => c !== db.cur);
    db.items = db.items.filter(i => i.cat !== db.cur);
    db.cur = db.cats[0]; save(); render(); return;
  }
  const item = e.target.closest(".item"); if (!item) return;
  const del = e.target.closest(".del");
  if (del) {
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "정말 지울까?"; return; }
    item.classList.add("gone");
    db.items = db.items.filter(i => i.id != item.dataset.id); save();
    setTimeout(() => { if (!db.items.some(i => i.cat === db.cur)) renderList(); else item.remove(); }, 420);
    return;
  }
  document.querySelectorAll(".item.open").forEach(x => {
    if (x !== item) { x.classList.remove("open"); const d = x.querySelector(".del"); d.classList.remove("sure"); d.textContent = "지우기"; }
  });
  item.classList.toggle("open");
  if (!item.classList.contains("open")) { const d = item.querySelector(".del"); d.classList.remove("sure"); d.textContent = "지우기"; }
};

render();
</script>
</body>
</html>
